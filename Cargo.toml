[package]
name = "vp9dec"
version = "0.1.0"
edition = "2021"
description = "A from-scratch, clean-room VP9 video decoder (Rust, zero dependency crates)"
license = "MIT"
repository = "https://github.com/ChanyaVRC/vp9dec"
documentation = "https://docs.rs/vp9dec"
readme = "README.md"
keywords = ["vp9", "video", "codec", "decoder", "webm"]
categories = ["multimedia::video", "multimedia::encoding"]
exclude = [".claude", "CLAUDE.md"]

[dependencies]

[dev-dependencies]
vp9dec = { path = ".", features = ["test-support"] }

[features]
test-support = []
# Per-stage wall-clock accounting (src/bench_timing.rs), read by examples/bench.rs's
# `--stages` report. Zero-cost when off: see src/bench_timing.rs for how.
bench-timing = []

[[example]]
name = "decode_to_png"
test = true

[[example]]
name = "webm_to_ivf"

[[example]]
name = "bench"
