[package]
name = "vp9dec"
version = "0.1.0"
edition = "2021"
description = "Fully from-scratch VP9 decoder (zero dependencies, built for future integration into Noiria)"
license = "MIT"
publish = false

[dependencies]

[dev-dependencies]
vp9dec = { path = ".", features = ["test-support"] }

[features]
test-support = []
# Per-stage wall-clock accounting (src/bench_timing.rs), read by examples/bench.rs's
# `--stages` report. Zero-cost when off: see src/bench_timing.rs for how.
bench-timing = []

[[example]]
name = "decode_to_png"
test = true

[[example]]
name = "webm_to_ivf"

[[example]]
name = "bench"
