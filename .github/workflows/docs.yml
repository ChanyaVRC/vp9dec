name: Docs

# Builds the rustdoc API docs and publishes them to GitHub Pages on every push to main.
# Only the public API is documented; the internal `#[doc(hidden)]` modules are excluded by
# rustdoc, matching what docs.rs shows. Published at https://chanyavrc.github.io/vp9dec/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Build rustdoc
        run: cargo doc --no-deps
      - name: Redirect site root to the crate index
        run: echo '<meta http-equiv="refresh" content="0; url=vp9dec/index.html">' > target/doc/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
