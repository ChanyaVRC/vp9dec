name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install rustfmt + clippy
        run: rustup component add rustfmt clippy
      - name: Format check
        run: cargo fmt --all --check
      - name: Check default features (without test-support)
        run: cargo check --lib --examples
      # Matches the project's documented lint gate (CLAUDE.md): warnings are surfaced but not
      # denied, so a pre-existing lint doesn't block CI. Tighten to `-- -D warnings` once the
      # tree is warning-clean.
      - name: Clippy
        run: cargo clippy --all-targets

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --all-targets
      # The conformance/sweep tests skip cleanly when the (uncommitted, ~3.5 GB) vector corpus
      # is absent, so the default suite runs fast in CI. Run both SIMD configurations, since
      # bit-exact output must hold with AVX2 auto-detected AND with SIMD forced off.
      - name: Test (SIMD auto-detected)
        run: cargo test
      - name: Test (forced scalar)
        run: cargo test
        env:
          VP9DEC_NO_SIMD: "1"

  test-release:
    name: test-release / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Guard opt-level=3 codegen (rustc/LLVM regressions and SIMD miscompilations under
      # release optimizations) across both SIMD configurations without adding serial runtime
      # to the debug test matrix.
      - name: Build (release)
        run: cargo build --release --all-targets
      - name: Test (release, SIMD auto-detected)
        run: cargo test --release
      - name: Test (release, forced scalar)
        run: cargo test --release
        env:
          VP9DEC_NO_SIMD: "1"
      - name: Test robustness/fuzz (release + debug-assertions)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --test robustness_test --test structured_fuzz_test
        env:
          RUSTFLAGS: "-C debug-assertions=on"
          VP9DEC_FUZZ_ITERS: "200"
          VP9DEC_FUZZ_LONG_ITERS: "1000"

  test-aarch64:
    name: test / ubuntu-24.04-arm (native aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify runner architecture
        run: |
          test "$(uname -m)" = "aarch64"
          rustc -vV | grep -q "^host: aarch64-unknown-linux-gnu$"
      - name: Build
        run: cargo build --all-targets
      # This executes the scalar fallback on real Arm64 hardware. The forced-scalar rerun above
      # is x86-specific coverage and would exercise the same path again on this runner.
      - name: Test
        run: cargo test
      - name: Build (release)
        run: cargo build --release --all-targets
      - name: Test (release)
        run: cargo test --release
