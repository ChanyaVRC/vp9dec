name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rustfmt + clippy
        run: rustup component add rustfmt clippy
      - name: Format check
        run: cargo fmt --all --check
      # Matches the project's documented lint gate (CLAUDE.md): warnings are surfaced but not
      # denied, so a pre-existing lint doesn't block CI. Tighten to `-- -D warnings` once the
      # tree is warning-clean.
      - name: Clippy
        run: cargo clippy --all-targets

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: cargo build --all-targets
      # The conformance/sweep tests skip cleanly when the (uncommitted, ~3.5 GB) vector corpus
      # is absent, so the default suite runs fast in CI. Run both SIMD configurations, since
      # bit-exact output must hold with AVX2 auto-detected AND with SIMD forced off.
      - name: Test (SIMD auto-detected)
        run: cargo test
      - name: Test (forced scalar)
        run: cargo test
        env:
          VP9DEC_NO_SIMD: "1"

  test-aarch64:
    name: test / ubuntu-24.04-arm (native aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runner architecture
        run: |
          test "$(uname -m)" = "aarch64"
          rustc -vV | grep -q "^host: aarch64-unknown-linux-gnu$"
      - name: Build
        run: cargo build --all-targets
      # This executes the scalar fallback on real Arm64 hardware. The forced-scalar rerun above
      # is x86-specific coverage and would exercise the same path again on this runner.
      - name: Test
        run: cargo test
